name: vatrushka

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vatrushka}
      POSTGRES_USER: ${POSTGRES_USER:-vatrushka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    network_mode: host
    env_file: ../../.env
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-vatrushka}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB:-vatrushka}
    command: ["sh", "-c", "npm run db:migrate:prod -w @vatrushka/api && node apps/api/dist/index.js"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-livekit.example.com}
      TURN_DOMAIN: ${TURN_DOMAIN:-turn.example.com}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["development"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [backend]
    logging: *logging

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
