name: vatrushka

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vatrushka}
      POSTGRES_USER: ${POSTGRES_USER:-vatrushka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: *logging

  api:
    # Local development may still build this image from the checkout. Delivery
    # wrappers set API_IMAGE to an immutable registry digest and invoke Compose
    # with --no-build, so a release never rebuilds code on a VPS.
    image: ${API_IMAGE:-vatrushka-api:local}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    restart: unless-stopped
    network_mode: host
    env_file: ${VATRUSHKA_APP_ENV_FILE:-../../.env}
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 3001
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      PRESENCE_STORAGE_DRIVER: redis
    command: ["sh", "infra/docker/api-start.sh"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      INVITE_DOMAIN: ${INVITE_DOMAIN:-invite.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-livekit.example.com}
      TURN_DOMAIN: ${TURN_DOMAIN:-turn.example.com}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The release job keeps artifacts outside the source tree.  This avoids
      # serving an empty bind mount when the runtime checkout is replaced.
      # Runtime releases live behind /opt/vatrushka/current. The feed must
      # remain outside that symlink so a deploy never detaches Caddy from beta
      # or stable updater artifacts when the release directory changes.
      - ${UPDATE_FEED_PATH:-/opt/vatrushka/updates}:/srv/updates:ro
      - caddy_data:/data
      - caddy_config:/config
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["development"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [backend]
    logging: *logging

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
