name: vatrushka-livekit

services:
  livekit:
    image: livekit/livekit-server:v1.13.1
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${VATRUSHKA_APP_ENV_FILE:-../../.env}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"

        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true

        room:
          empty_timeout: 600
          departure_timeout: 60
          max_participants: 5

        webhook:
          api_key: "${LIVEKIT_API_KEY}"
          urls:
            - "${LIVEKIT_WEBHOOK_URL:?LIVEKIT_WEBHOOK_URL is required}"

        turn:
          enabled: true
          domain: "${TURN_DOMAIN:?TURN_DOMAIN is required}"
          udp_port: 3478
          tls_port: 5349
          cert_file: "${TURN_CERT_DIRECTORY:-/etc/letsencrypt/live}/${TURN_DOMAIN}/fullchain.pem"
          key_file: "${TURN_CERT_DIRECTORY:-/etc/letsencrypt/live}/${TURN_DOMAIN}/privkey.pem"

        logging:
          level: info
          json: true
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
