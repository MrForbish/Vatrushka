# Reference template for manual deployments.
# Docker Compose injects the production config and credentials through environment variables.

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

keys:
  replace-me-key: replace-me-with-a-long-random-secret

room:
  empty_timeout: 600
  departure_timeout: 60
  max_participants: 5

webhook:
  api_key: replace-me-key
  urls:
    - https://api.example.com/api/v1/integrations/livekit/webhook

turn:
  enabled: true
  domain: turn.example.com
  udp_port: 3478
  tls_port: 5349
  cert_file: /etc/letsencrypt/live/turn.example.com/fullchain.pem
  key_file: /etc/letsencrypt/live/turn.example.com/privkey.pem

logging:
  level: info
  json: true
