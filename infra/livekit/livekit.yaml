port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

keys:
  # Replace both values before starting. Keep them equal to LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
  replace-me-key: replace-me-with-a-long-random-secret

room:
  empty_timeout: 600
  departure_timeout: 60
  max_participants: 5

webhook:
  api_key: replace-me-key
  urls:
    - https://api.example.com/api/v1/webhooks/livekit

turn:
  enabled: true
  domain: turn.example.com
  udp_port: 3478
  tls_port: 5349
  cert_file: /certs/fullchain.pem
  key_file: /certs/privkey.pem

logging:
  level: info
  json: true
