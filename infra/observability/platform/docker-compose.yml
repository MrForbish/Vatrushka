name: vatrushka-observability-platform

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:?GRAFANA_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "${GRAFANA_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${GRAFANA_BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${GRAFANA_BIND_ADDRESS:-0.0.0.0}:443:443/udp"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [grafana]
    networks: [frontend, monitoring]
    logging: *logging

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:?GRAFANA_DOMAIN is required}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_CONTENT_TYPE_PROTECTION: "true"
    secrets: [grafana_admin_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    depends_on: [prometheus, loki]
    logging: *logging

  prometheus:
    image: quay.io/prometheus/prometheus:v3.12.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-55GB}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "${OBSERVABILITY_PRIVATE_BIND_IP:?OBSERVABILITY_PRIVATE_BIND_IP is required}:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    depends_on: [alertmanager, blackbox-exporter]
    logging: *logging

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    secrets: [alertmanager_webhook_url]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring, egress]
    logging: *logging

  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/loki_aws_credentials
      AWS_PROFILE: default
      LOKI_S3_ENDPOINT: ${LOKI_S3_ENDPOINT:?LOKI_S3_ENDPOINT is required}
      LOKI_S3_REGION: ${LOKI_S3_REGION:?LOKI_S3_REGION is required}
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:?LOKI_S3_BUCKET is required}
      NO_PROXY: 0.0.0.0,127.0.0.1,localhost,loki,prometheus,alertmanager,grafana,blackbox-exporter
      no_proxy: 0.0.0.0,127.0.0.1,localhost,loki,prometheus,alertmanager,grafana,blackbox-exporter
    ports:
      - "${OBSERVABILITY_PRIVATE_BIND_IP:?OBSERVABILITY_PRIVATE_BIND_IP is required}:3100:3100"
    secrets: [loki_aws_credentials]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [monitoring, egress]
    logging: *logging

  loki-canary:
    image: grafana/loki-canary:3.5.5
    restart: unless-stopped
    command:
      - -addr=loki:3100
      - -labelname=service
      - -labelvalue=loki-canary
      - -user=self-monitoring
    networks: [monitoring]
    depends_on: [loki]
    logging: *logging

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks: [monitoring, egress]
    logging: *logging

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    logging: *logging

  alloy:
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/platform.alloy
    environment:
      OBSERVABILITY_HOST: observability
      OBSERVABILITY_ENVIRONMENT: production
      OBSERVABILITY_REGION: ru
    volumes:
      - ./alloy/platform.alloy:/etc/alloy/platform.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks: [monitoring]
    depends_on: [loki]
    logging: *logging

networks:
  frontend:
  egress:
  monitoring:
    internal: true

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  caddy_data:
  caddy_config:

secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?GRAFANA_ADMIN_PASSWORD_FILE is required}
  alertmanager_webhook_url:
    file: ${ALERTMANAGER_WEBHOOK_URL_FILE:?ALERTMANAGER_WEBHOOK_URL_FILE is required}
  loki_aws_credentials:
    file: ${LOKI_S3_CREDENTIALS_FILE:?LOKI_S3_CREDENTIALS_FILE is required}
