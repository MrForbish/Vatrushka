global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
  external_labels:
    environment: production
    region: ru
    monitoring_cluster: primary

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: [prometheus:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]

  - job_name: observability-node
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          host: observability

  - job_name: observability-alloy
    static_configs:
      - targets: [alloy:12345]
        labels:
          host: observability

  - job_name: blackbox-http
    metrics_path: /probe
    scrape_interval: 30s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.myvatrushka.ru/health/ready
          - https://api.myvatrushka.ru/updates/latest.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-turn
    metrics_path: /probe
    scrape_interval: 60s
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [turn.myvatrushka.ru:5349]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
