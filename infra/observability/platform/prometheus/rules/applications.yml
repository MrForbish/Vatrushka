groups:
  - name: vatrushka-api-recording
    interval: 30s
    rules:
      - record: vatrushka:api_requests:rate5m
        expr: sum by (environment, status_class) (rate(api_http_requests_total[5m]))

      - record: vatrushka:api_4xx_ratio:rate5m
        expr: sum by (environment) (rate(api_http_requests_total{status_class="4xx"}[5m])) / clamp_min(sum by (environment) (rate(api_http_requests_total[5m])), 0.001)

      - record: vatrushka:api_5xx_ratio:rate5m
        expr: sum by (environment) (rate(api_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum by (environment) (rate(api_http_requests_total[5m])), 0.001)

      - record: vatrushka:api_request_duration_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (environment, le) (rate(api_http_request_duration_seconds_bucket[5m])))

      - record: vatrushka:api_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (environment, le) (rate(api_http_request_duration_seconds_bucket[5m])))

      - record: vatrushka:api_request_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (environment, le) (rate(api_http_request_duration_seconds_bucket[5m])))

      - record: vatrushka:api_route_request_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (environment, le, method, route) (rate(api_http_request_duration_seconds_bucket[5m])))

  - name: vatrushka-application
    rules:
      - alert: VatrushkaApiDown
        expr: up{job="vatrushka-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Vatrushka API metrics are unavailable

      - alert: VatrushkaPublicReadinessDown
        expr: probe_success{job="blackbox-http",instance="https://api.myvatrushka.ru/health/ready"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Public API readiness probe is failing

      - alert: VatrushkaApiFiveXxRatioHigh
        expr: (vatrushka:api_5xx_ratio:rate5m > 0.001) and on (environment) (sum by (environment) (vatrushka:api_requests:rate5m) > 0.1)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: API 5xx ratio is above 0.1 percent
          description: "5xx exceeded the 99.9% success SLO while traffic remained above the minimum volume."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/develop/docs/observability-runbook.md#api-http"

      - alert: VatrushkaApiFiveXxRatioCritical
        expr: (vatrushka:api_5xx_ratio:rate5m > 0.01) and on (environment) (sum by (environment) (vatrushka:api_requests:rate5m) > 0.1)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: API 5xx ratio is above 1 percent
          description: "At least one percent of API requests are failing with 5xx responses."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/develop/docs/observability-runbook.md#api-http"

      - alert: VatrushkaApiFourXxRatioHigh
        expr: (vatrushka:api_4xx_ratio:rate5m > 0.1) and on (environment) (sum by (environment) (vatrushka:api_requests:rate5m) > 0.2)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: API 4xx ratio is above 10 percent
          description: "Rejected requests are elevated; inspect route, method and bounded error codes before treating this as a server incident."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/develop/docs/observability-runbook.md#api-http"

      - alert: VatrushkaApiUnhandledErrors
        expr: sum by (code, route) (increase(api_errors_total{status_class="5xx"}[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: API returned an internal or dependency error
          description: "{{ $labels.code }} on {{ $labels.route }} occurred {{ $value }} time(s) in 5 minutes"

      - alert: VatrushkaScreenShareHeartbeatFailures
        expr: sum by (result) (increase(screen_share_lease_heartbeat_total{result=~"ownership_lost|dependency_error"}[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: Screen-share lease heartbeat is failing
          description: "Heartbeat result {{ $labels.result }} occurred {{ $value }} time(s) in 5 minutes"

      - alert: VatrushkaApiLatencyHigh
        expr: vatrushka:api_request_duration_seconds:p95_5m > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: API p95 latency is above 500 ms
          description: "API p95 latency stayed above the initial 500 ms JSON-route objective for 10 minutes."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/develop/docs/observability-runbook.md#api-http"

      - alert: VatrushkaOutboxFailed
        expr: chat_outbox_failed > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Messaging outbox contains failed events

      - alert: VatrushkaWebSocketReconnectBurst
        expr: sum(increase(chat_ws_connection_events_total{event=~"reconnected|error|heartbeat_timeout"}[10m])) > 20
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: WebSocket reconnect or failure rate is elevated
          description: "More than 20 reconnect, network error or heartbeat timeout events were recorded in 10 minutes."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/main/docs/observability-runbook.md#realtime-and-messaging"

      - alert: VatrushkaMessageCreateErrors
        expr: sum(increase(chat_message_create_errors_total[10m])) > 2
        labels: { severity: warning }
        annotations:
          summary: Message creation errors were recorded
          description: "The API failed to create {{ $value }} messages in 10 minutes."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/main/docs/observability-runbook.md#realtime-and-messaging"

      - alert: VatrushkaVoicePresenceDrift
        expr: sum(increase(voice_presence_reconciliation_diff_total[15m])) > 5 or sum(increase(voice_websocket_version_gap_total[15m])) > 5
        labels: { severity: warning }
        annotations:
          summary: Voice presence requires frequent reconciliation
          description: "Voice projection drift or WebSocket version gaps exceeded the expected baseline."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/main/docs/observability-runbook.md#voice-and-screen-share"

      - alert: VatrushkaScreenShareLeaseConflict
        expr: sum(increase(screen_share_lease_events_total{result=~"busy|ownership_lost|error"}[10m])) > 3
        labels: { severity: warning }
        annotations:
          summary: Screen-share lease conflicts are elevated
          description: "Screen-share ownership conflicts or dependency errors exceeded the expected baseline."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/main/docs/observability-runbook.md#voice-and-screen-share"

      - alert: VatrushkaObjectStorageErrors
        expr: sum(increase(object_storage_requests_total{result="error"}[10m])) > 2
        labels: { severity: warning }
        annotations:
          summary: Private object storage operations are failing
          description: "S3 operations failed {{ $value }} times in 10 minutes."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/main/docs/observability-runbook.md#dependencies-and-delivery"

      - alert: VatrushkaLoginFailureBurst
        expr: sum(increase(auth_login_attempts_total{result=~"rejected|error"}[15m])) > 25
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Login failures are elevated
          description: "Rejected or failed login steps exceeded the expected baseline."
          runbook_url: "https://gitlab.com/vatrushka-group/Vatrushka/-/blob/main/docs/observability-runbook.md#dependencies-and-delivery"

      - alert: VatrushkaOutboxBacklog
        expr: chat_outbox_oldest_age_seconds > 60
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Messaging outbox is delayed

      - alert: VatrushkaRedisPublishErrors
        expr: increase(chat_redis_publish_errors_total[5m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Realtime Redis publish errors were recorded

      - alert: VatrushkaRedisEvictions
        expr: increase(redis_evicted_keys_total[10m]) > 0
        labels: { severity: critical }
        annotations:
          summary: Redis evicted keys

      - alert: VatrushkaPostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: PostgreSQL connection usage is above 80 percent

      - alert: VatrushkaCertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: A monitored TLS certificate expires in less than 14 days
