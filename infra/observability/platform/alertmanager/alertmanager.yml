global:
  resolve_timeout: 5m

route:
  receiver: technical-webhook
  group_by: [alertname, environment, service, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      repeat_interval: 1h
    - matchers: [severity="warning"]
      repeat_interval: 6h

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, host, service]

receivers:
  - name: technical-webhook
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
