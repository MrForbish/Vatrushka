name: Production release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        env:
          PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH || 'master' }}
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo 'Tag must be vMAJOR.MINOR.PATCH.' >&2; exit 1; }
          version=${BASH_REMATCH[1]}
          git fetch origin "$PRODUCTION_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$PRODUCTION_BRANCH" || { echo 'Tagged commit is not in the production branch.' >&2; exit 1; }
          [[ "$(node -p "require('./package.json').version")" == "$version" ]] || { echo 'Tag and package version differ.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    uses: ./.github/workflows/pr-checks.yml

  windows-package:
    runs-on: windows-latest
    needs: [verify-tag, quality]
    env:
      VITE_PUBLIC_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://api.myvatrushka.ru' }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WINDOWS_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: npm run release:validate
        env:
          PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH || 'master' }}
          RELEASE_BRANCH: ${{ vars.PRODUCTION_BRANCH || 'master' }}
      - run: npm run package:win
      - name: Create production metadata and checksums
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release/* -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content apps/desktop/release/SHA256SUMS.txt
          $metadata = [ordered]@{
            version = '${{ needs.verify-tag.outputs.version }}'
            commitSha = $env:GITHUB_SHA
            tag = $env:GITHUB_REF_NAME
            channel = 'stable'
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
            workflowRunId = $env:GITHUB_RUN_ID
          }
          $metadata | ConvertTo-Json | Set-Content apps/desktop/release/release-metadata.json
      - uses: actions/upload-artifact@v7
        with:
          name: vatrushka-production-${{ needs.verify-tag.outputs.version }}
          path: apps/desktop/release/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [verify-tag, windows-package]
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_UPDATE_PATH: ${{ vars.PRODUCTION_UPDATE_PATH }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vatrushka-production-${{ needs.verify-tag.outputs.version }}
          path: release
      - name: Require scoped publication configuration
        shell: bash
        run: |
          for name in PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_HOST_KEY PRODUCTION_SSH_HOST PRODUCTION_SSH_USER PRODUCTION_UPDATE_PATH; do
            [[ -n "${!name}" ]] || { echo "Required production setting is missing: $name" >&2; exit 1; }
          done
          [[ "$PRODUCTION_UPDATE_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo 'PRODUCTION_UPDATE_PATH has unsafe characters.' >&2; exit 1; }
      - name: Create immutable GitHub Release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --draft --title "Vatrushka ${{ needs.verify-tag.outputs.version }}"
          fi
      - name: Publish stable update feed atomically
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_SSH_HOST_KEY" > ~/.ssh/known_hosts
          setup=$(find release -maxdepth 1 -name 'Vatrushka-Setup-*-x64.exe' -print -quit)
          blockmap=$(find release -maxdepth 1 -name 'Vatrushka-Setup-*-x64.exe.blockmap' -print -quit)
          [[ -f "$setup" && -f "$blockmap" && -f release/latest.yml ]] || { echo 'Stable feed artifacts are incomplete.' >&2; exit 1; }
          remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
          scp "$setup" "$blockmap" release/SHA256SUMS.txt release/release-metadata.json "$remote:$PRODUCTION_UPDATE_PATH/"
          scp release/latest.yml "$remote:$PRODUCTION_UPDATE_PATH/latest.yml.next"
          # The path is intentionally expanded client-side after the strict allowlist check above.
          # shellcheck disable=SC2029
          ssh "$remote" "mv -- '$PRODUCTION_UPDATE_PATH/latest.yml.next' '$PRODUCTION_UPDATE_PATH/latest.yml'"
      - name: Publish GitHub Release after stable feed succeeds
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
