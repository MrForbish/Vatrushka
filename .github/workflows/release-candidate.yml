name: Release candidate

on:
  pull_request:
    branches: ['release/**']
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/pr-checks.yml

  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: npm run release:validate
        env:
          PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH || 'master' }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - run: npm run db:check
      - name: Write migration report
        shell: bash
        run: |
          mkdir -p release-metadata
          {
            echo "commit=${GITHUB_SHA}"
            echo "migration_count=$(find apps/api/drizzle -maxdepth 1 -name '*.sql' | wc -l)"
            echo "last_migration=$(find apps/api/drizzle -maxdepth 1 -name '*.sql' -printf '%f\n' | sort | tail -1)"
          } > release-metadata/migrations.txt
      - uses: actions/upload-artifact@v7
        with:
          name: migration-report
          path: release-metadata/migrations.txt

  database-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vatrushka_upgrade
          POSTGRES_USER: vatrushka
          POSTGRES_PASSWORD: upgrade-test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vatrushka -d vatrushka_upgrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vatrushka:upgrade-test-password@127.0.0.1:5432/vatrushka_upgrade
      PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH || 'master' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Apply previous production schema
        shell: bash
        run: |
          git fetch origin "$PRODUCTION_BRANCH"
          git worktree add ../previous-production "origin/$PRODUCTION_BRANCH"
          npm --prefix ../previous-production ci
          npm --prefix ../previous-production run build -w @vatrushka/shared
          npm --prefix ../previous-production run db:migrate -w @vatrushka/api
      - name: Upgrade to candidate schema
        shell: bash
        run: |
          npm run build -w @vatrushka/shared
          npm run db:migrate -w @vatrushka/api
          npm run db:check
          mkdir -p release-metadata
          printf 'previous_ref=%s\ncandidate_sha=%s\nresult=passed\n' "origin/$PRODUCTION_BRANCH" "$GITHUB_SHA" > release-metadata/database-upgrade.txt
      - uses: actions/upload-artifact@v7
        with:
          name: database-upgrade-report
          path: release-metadata/database-upgrade.txt

  windows-rc:
    runs-on: windows-latest
    needs: [quality, validate-release, database-upgrade]
    env:
      VITE_PUBLIC_API_BASE_URL: ${{ vars.RC_API_BASE_URL || vars.PRODUCTION_API_BASE_URL || 'https://api.myvatrushka.ru' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: npm run package:win
      - name: Verify clean install and upgrade from production
        env:
          PRODUCTION_UPDATE_FEED: ${{ vars.PRODUCTION_UPDATE_FEED || 'https://api.myvatrushka.ru/updates' }}
        shell: pwsh
        run: |
          function Install-Client([string]$Path) {
            $process = Start-Process -FilePath $Path -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Silent install failed with $($process.ExitCode): $Path" }
            $installed = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Recurse -Filter 'Ватрушка.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $installed) { throw 'Installed application executable was not found' }
            return $installed
          }
          function Uninstall-Client {
            $uninstaller = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Recurse -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $uninstaller) { throw 'Uninstaller was not found after clean install' }
            $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Silent uninstall failed with $($process.ExitCode)" }
          }
          $setup = Get-ChildItem apps/desktop/release/Vatrushka-Setup-*-x64.exe | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer was not created' }
          Install-Client $setup.FullName | Out-Null
          Uninstall-Client

          $latest = Invoke-RestMethod "$env:PRODUCTION_UPDATE_FEED/latest.yml"
          $match = [regex]::Match([string]$latest, '(?m)^path:\s*([^\r\n]+)$')
          if (-not $match.Success) { throw 'Production latest.yml does not contain an installer path' }
          $previousName = $match.Groups[1].Value.Trim().Trim('"').Trim("'")
          $feedBase = [Uri]"$env:PRODUCTION_UPDATE_FEED/"
          $previousUri = [Uri]::new($feedBase, $previousName)
          $previousSetup = Join-Path $env:RUNNER_TEMP 'Vatrushka-previous.exe'
          Invoke-WebRequest $previousUri -OutFile $previousSetup
          Install-Client $previousSetup | Out-Null
          Install-Client $setup.FullName | Out-Null
      - name: Create RC metadata and checksums
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $setup = Get-ChildItem apps/desktop/release/Vatrushka-Setup-*-x64.exe | Select-Object -First 1
          $rcName = "Vatrushka-$($package.version)-rc.$env:GITHUB_RUN_NUMBER-$shortSha.exe"
          Copy-Item $setup.FullName "apps/desktop/release/$rcName"
          Get-ChildItem apps/desktop/release/* -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content apps/desktop/release/SHA256SUMS.txt
          $metadata = [ordered]@{
            version = "$($package.version)-rc.$env:GITHUB_RUN_NUMBER"
            commitSha = $env:GITHUB_SHA
            baseTag = (git describe --tags --abbrev=0 2>$null)
            buildNumber = [int]$env:GITHUB_RUN_NUMBER
            channel = 'rc'
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
            workflowRunId = $env:GITHUB_RUN_ID
          }
          $metadata | ConvertTo-Json | Set-Content apps/desktop/release/release-metadata.json
      - uses: actions/upload-artifact@v7
        with:
          name: vatrushka-rc-${{ github.run_number }}-${{ github.sha }}
          path: apps/desktop/release/*
          if-no-files-found: error
