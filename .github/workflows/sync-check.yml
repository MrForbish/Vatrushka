name: Release sync check

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  sync:
    if: github.head_ref == (vars.PRODUCTION_BRANCH || 'master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate released tag and title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          [[ "$PR_TITLE" == \[SYNC\]* ]] || { echo 'Sync PR title must start with [SYNC].' >&2; exit 1; }
          latest_tag=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [[ -n "$latest_tag" ]] || { echo 'No production SemVer tag is contained in the sync source.' >&2; exit 1; }
          echo "Sync contains production tag $latest_tag"
