name: Release PR

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/pr-checks.yml

  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - run: npm run release:validate
        env:
          PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH || 'master' }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
      - name: Reject development configuration
        shell: bash
        run: |
          if grep -RInE 'localhost:|127\.0\.0\.1:|VITE_.*DEBUG=true' apps/desktop/.env.production.example apps/desktop/package.json; then
            echo 'Production desktop configuration contains a development URL or debug flag.' >&2
            exit 1
          fi
      - name: Require rollback and release notes in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          printf '%s' "$PR_BODY" | grep -qi 'rollback' || { echo 'PR body must contain a rollback plan.' >&2; exit 1; }
          printf '%s' "$PR_BODY" | grep -Eqi 'release (notes|evidence)|release notes|release evidence' || { echo 'PR body must reference release notes/evidence.' >&2; exit 1; }
      - name: Confirm publication is disabled in PR workflows
        run: echo 'Production publication is intentionally available only to production-release.yml tag runs.'
