name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      # Repository variable switches this from transitional master to main during cutover.
      PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH || 'master' }}
      PR_HEAD: ${{ github.head_ref }}
      PR_BASE: ${{ github.base_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate pull request direction and naming
        run: node .github/scripts/pr-policy.mjs
