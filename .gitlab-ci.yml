workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - policy
  - quality
  - release
  - deploy
  - package
  - publish

variables:
  GIT_DEPTH: "0"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  PRODUCTION_BRANCH: "main"
  PRODUCTION_API_BASE_URL: "https://api.myvatrushka.ru"
  PRODUCTION_UPDATE_FEED: "https://api.myvatrushka.ru/updates"
  OBSERVABILITY_SSH_HOST: "201.51.4.24"
  WINDOWS_TOOLCHAIN_MIRROR: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/windows-toolchain/43.1.1"
  WINDOWS_CSC_ENABLED: "false"

.node-linux:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:24-bookworm
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  cache:
    key:
      files: [package-lock.json]
      prefix: linux-npm
    paths: [.npm/]
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  interruptible: true

.node-windows:
  tags: [vatrushka-windows]
  variables:
    PLAYWRIGHT_BROWSERS_PATH: '$CI_PROJECT_DIR/.cache/ms-playwright'
    ELECTRON_BUILDER_CACHE: '$CI_PROJECT_DIR/.cache/electron-builder'
  cache:
    key:
      files: [package-lock.json]
      prefix: windows-node-playwright
    paths:
      - .npm/
      - .cache/ms-playwright/
    policy: pull-push
  before_script:
    - $env:Path = "$env:NODE_HOME;$env:Path"
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  interruptible: true

.node-windows-package:
  extends: .node-windows
  cache:
    - key:
        files: [package-lock.json]
        prefix: windows-node-playwright
      paths:
        - .npm/
      policy: pull-push
    - key: windows-toolchain-43-1-1
      paths:
        - .cache/electron-builder/
        - .cache/electron-dist/
      policy: pull-push

.observability-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [infra/observability/**/*, scripts/observability/**/*]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

merge-request-policy:
  extends: .node-linux
  stage: policy
  timeout: 2m
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - node scripts/policy/merge-request-policy.mjs
    - |
      if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" = "$PRODUCTION_BRANCH" ] && [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = "develop" ]; then
        latest_tag=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
        test -n "$latest_tag" || { echo 'Sync MR does not contain a production SemVer tag.' >&2; exit 1; }
        echo "Sync contains production tag $latest_tag"
      fi

verify-tag:
  extends: .node-linux
  stage: policy
  timeout: 2m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_TAG'
      when: never
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      git fetch origin "$PRODUCTION_BRANCH"
      git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$PRODUCTION_BRANCH" || { echo 'Tagged commit is not in the production branch.' >&2; exit 1; }
      test "$(node -p "require('./package.json').version")" = "$version" || { echo 'Tag and package version differ.' >&2; exit 1; }
      printf 'VERSION=%s\n' "$version" > release.env
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 30 days

verify:
  extends:
    - .node-linux
  stage: quality
  # The complete quality bundle includes lint, typecheck, unit tests and builds.
  # Self-hosted runners may be temporarily CPU-constrained; eight minutes causes
  # a false timeout while lint is still making progress.
  timeout: 20m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [apps/**/*, packages/**/*, scripts/**/*, infra/docker/**/*, package.json, package-lock.json, tsconfig.base.json, eslint.config.*]
  script:
    - npm run repo-policy:test
    - npm run version:check
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run db:check
    - npm run build
    - npm run perf:check

integration:
  extends:
    - .node-linux
  stage: quality
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [apps/api/**/*, packages/**/*, scripts/**/*, infra/docker/**/*, package.json, package-lock.json]
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:17-alpine
      alias: postgres
      pull_policy: if-not-present
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/redis:8-alpine
      alias: redis
      pull_policy: if-not-present
  variables:
    POSTGRES_DB: vatrushka_test
    POSTGRES_USER: vatrushka
    POSTGRES_PASSWORD: integration-test-password
    INTEGRATION_DATABASE_URL: postgresql://vatrushka:integration-test-password@postgres:5432/vatrushka_test
    INTEGRATION_REDIS_URL: redis://redis:6379/15
  script:
    - npm run build -w @vatrushka/shared
    - npm run test:integration

observability-compose:
  extends: .observability-rules
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28-cli
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  script:
    - cp infra/observability/platform/.env.observability.example infra/observability/platform/.env.observability
    - cp infra/observability/platform/secrets/grafana_admin_password.example infra/observability/platform/secrets/grafana_admin_password
    - cp infra/observability/platform/secrets/alertmanager_webhook_url.example infra/observability/platform/secrets/alertmanager_webhook_url
    - cp infra/observability/platform/secrets/loki_aws_credentials.example infra/observability/platform/secrets/loki_aws_credentials
    - docker compose --env-file infra/observability/platform/.env.observability -f infra/observability/platform/docker-compose.yml config -q
    - POSTGRES_PASSWORD=validation REDIS_PASSWORD=validation docker compose --env-file infra/observability/agents/.env.agent.example -f infra/observability/agents/docker-compose.yml --profile product --profile docker config -q

observability-prometheus:
  extends: .observability-rules
  image:
    name: quay.io/prometheus/prometheus:v3.12.0
    entrypoint: [""]
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  script:
    - promtool check config infra/observability/platform/prometheus/prometheus.yml
    - promtool check rules infra/observability/platform/prometheus/rules/*.yml

observability-alertmanager:
  extends: .observability-rules
  image:
    name: quay.io/prometheus/alertmanager:v0.28.1
    entrypoint: [""]
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  script:
    - amtool check-config infra/observability/platform/alertmanager/alertmanager.yml

observability-loki:
  extends: .observability-rules
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/grafana/loki:3.5.5
    entrypoint: [""]
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  variables:
    AWS_ACCESS_KEY_ID: validation
    AWS_SECRET_ACCESS_KEY: validation
    LOKI_S3_ENDPOINT: https://s3.example.invalid
    LOKI_S3_REGION: ru-1
    LOKI_S3_BUCKET: validation
  script:
    - /usr/bin/loki -verify-config=true -config.expand-env=true -config.file=infra/observability/platform/loki/loki.yml

observability-alloy:
  extends: .observability-rules
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/grafana/alloy:v1.10.2
    entrypoint: [""]
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  variables:
    OBSERVABILITY_HOST: validation
    OBSERVABILITY_ROLE: product
    OBSERVABILITY_ENVIRONMENT: production
    OBSERVABILITY_REGION: ru
    PROMETHEUS_REMOTE_WRITE_URL: http://127.0.0.1:9090/api/v1/write
    LOKI_WRITE_URL: http://127.0.0.1:3100/loki/api/v1/push
  script:
    - alloy validate infra/observability/platform/alloy/platform.alloy
    - alloy validate infra/observability/agents/alloy/product.alloy
    - alloy validate infra/observability/agents/alloy/runner.alloy

observability-caddy:
  extends: .observability-rules
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/caddy:2.10-alpine
    entrypoint: [""]
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  variables:
    GRAFANA_DOMAIN: grafana.example.invalid
    ACME_EMAIL: observability@example.invalid
  script:
    - caddy validate --config infra/observability/platform/reverse-proxy/Caddyfile --adapter caddyfile

desktop-behavior:
  extends:
    - .node-windows
  stage: quality
  timeout: 12m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [apps/desktop/**/*, packages/shared/**/*, packages/config/**/*, package.json, package-lock.json]
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/prepare-windows-browser-tests.ps1
    - npx playwright install chromium
    - npm run build -w @vatrushka/shared
    - node scripts/ci/run-with-budget.mjs --name "Storybook interaction" --budget-seconds 180 -- npm run test:storybook
    - node scripts/ci/run-with-budget.mjs --name "Electron E2E" --budget-seconds 90 -- npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths:
      - apps/desktop/test-results/
      - apps/desktop/playwright-report/

visual-regression:
  extends:
    - .node-windows
  stage: quality
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [apps/desktop/**/*, packages/shared/**/*, packages/config/**/*, package.json, package-lock.json]
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/prepare-windows-browser-tests.ps1
    - npx playwright install chromium
    - npm run build -w @vatrushka/shared
    - node scripts/ci/run-with-budget.mjs --name "Static Storybook visual" --budget-seconds 180 -- npm run test:visual
  after_script:
    - |
      $storybookListeners = @(Get-NetTCPConnection -LocalPort 6006 -State Listen -ErrorAction SilentlyContinue)
      $storybookListeners |
        Select-Object -ExpandProperty OwningProcess -Unique |
        ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
      Write-Output "Storybook port cleanup complete."
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths:
      - apps/desktop/test-results/
      - apps/desktop/playwright-report/

release-validate:
  extends:
    - .node-linux
  stage: release
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  variables:
    RELEASE_BRANCH: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
  script:
    - |
      if [ -z "$RELEASE_BRANCH" ]; then export RELEASE_BRANCH="$CI_COMMIT_BRANCH"; fi
      npm run release:validate
    - npm run db:check
    - |
      mkdir -p release-metadata
      {
        echo "commit=$CI_COMMIT_SHA"
        echo "migration_count=$(find apps/api/drizzle -maxdepth 1 -name '*.sql' | wc -l)"
        echo "last_migration=$(find apps/api/drizzle -maxdepth 1 -name '*.sql' -printf '%f\n' | sort | tail -1)"
      } > release-metadata/migrations.txt
  artifacts:
    expire_in: 30 days
    paths: [release-metadata/migrations.txt]

database-upgrade:
  extends:
    - .node-linux
  stage: release
  timeout: 8m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:17-alpine
      alias: postgres
      pull_policy: if-not-present
  variables:
    POSTGRES_DB: vatrushka_upgrade
    POSTGRES_USER: vatrushka
    POSTGRES_PASSWORD: upgrade-test-password
    DATABASE_URL: postgresql://vatrushka:upgrade-test-password@postgres:5432/vatrushka_upgrade
  script:
    - |
      PREVIOUS_WORKTREE="../previous-production-$CI_JOB_ID"
      cleanup_previous_worktree() {
        git worktree remove --force "$PREVIOUS_WORKTREE" >/dev/null 2>&1 || true
        git worktree prune
      }
      trap cleanup_previous_worktree EXIT
      git fetch origin "$PRODUCTION_BRANCH"
      git worktree add "$PREVIOUS_WORKTREE" "origin/$PRODUCTION_BRANCH"
      npm --prefix "$PREVIOUS_WORKTREE" ci --prefer-offline --no-audit --no-fund
      npm --prefix "$PREVIOUS_WORKTREE" run build -w @vatrushka/shared
      npm --prefix "$PREVIOUS_WORKTREE" run db:migrate -w @vatrushka/api
    - npm run build -w @vatrushka/shared
    - npm run db:migrate -w @vatrushka/api
    - npm run db:check
    - mkdir -p release-metadata
    - printf 'previous_ref=%s\ncandidate_sha=%s\nresult=passed\n' "origin/$PRODUCTION_BRANCH" "$CI_COMMIT_SHA" > release-metadata/database-upgrade.txt
  artifacts:
    expire_in: 30 days
    paths: [release-metadata/database-upgrade.txt]

release-evidence:
  extends: .node-linux
  stage: release
  timeout: 4m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  variables:
    RELEASE_BRANCH: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
  script:
    - npm run release:validate
    - |
      if grep -RInE 'localhost:|127\.0\.0\.1:|VITE_.*DEBUG=true' apps/desktop/.env.production.example apps/desktop/package.json; then
        echo 'Production desktop configuration contains a development URL or debug flag.' >&2
        exit 1
      fi
    - printf '%s' "$CI_MERGE_REQUEST_DESCRIPTION" | grep -qi 'rollback' || { echo 'MR description must contain a rollback plan.' >&2; exit 1; }
    - printf '%s' "$CI_MERGE_REQUEST_DESCRIPTION" | grep -Eqi 'release (notes|evidence)|release notes|release evidence' || { echo 'MR description must reference release notes/evidence.' >&2; exit 1; }

release-auth-smoke:
  image: registry.gitlab.com/gitlab-org/cli:v1.108.0
  tags: [vatrushka-linux]
  stage: release
  timeout: 2m
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: 'true'
  script:
    - glab release view v0.6.6 >/dev/null

prepare-production-source:
  extends: .node-linux
  stage: deploy
  timeout: 3m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
  script:
    - git archive --format=tar "$CI_COMMIT_SHA" | gzip -n > release-source.tar.gz
    - test -s release-source.tar.gz
  artifacts:
    expire_in: 1 day
    paths: [release-source.tar.gz]

.production-ssh:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.22
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  environment:
    name: production
    url: https://api.myvatrushka.ru
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client
    - |
      for name in PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_HOST_KEY PRODUCTION_SSH_HOST PRODUCTION_SSH_USER PRODUCTION_UPDATE_PATH; do
        test -n "$(eval "printf '%s' \"\$$name\"")" || { echo "Required production setting is missing: $name" >&2; exit 1; }
      done
      echo "$PRODUCTION_UPDATE_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$' || { echo 'PRODUCTION_UPDATE_PATH has unsafe characters.' >&2; exit 1; }
      install -d -m 700 ~/.ssh
      install -m 600 "$PRODUCTION_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
      install -m 600 "$PRODUCTION_SSH_HOST_KEY" ~/.ssh/known_hosts

deploy-production-runtime:
  extends: .production-ssh
  stage: deploy
  timeout: 20m
  resource_group: production-runtime
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
    - job: prepare-production-source
      artifacts: true
  script:
    - remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
    - archive="/tmp/vatrushka-${CI_COMMIT_TAG}.tar.gz"
    - scp release-source.tar.gz "$remote:$archive"
    - ssh "$remote" "sudo -n sh -s -- '$archive' '$VERSION' '$CI_COMMIT_SHA' '$PRODUCTION_UPDATE_PATH'" < scripts/deploy/apply-product-release.sh

deploy-observability-runtime:
  extends: .production-ssh
  stage: deploy
  timeout: 20m
  resource_group: observability-runtime
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
    - job: deploy-production-runtime
    - job: prepare-production-source
      artifacts: true
  script:
    - remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
    - archive="/tmp/vatrushka-observability-${CI_COMMIT_TAG}.tar.gz"
    - scp release-source.tar.gz infra/deploy/monitoring-known_hosts "$remote:/tmp/"
    - |
      ssh "$remote" "sudo -n sh -s -- '$archive' '$OBSERVABILITY_SSH_HOST'" <<'REMOTE_SETUP'
      set -eu
      install -d -m 700 /root/.ssh
      touch /root/.ssh/known_hosts
      grep -qxF "$(cat /tmp/monitoring-known_hosts)" /root/.ssh/known_hosts || cat /tmp/monitoring-known_hosts >> /root/.ssh/known_hosts
      chmod 600 /root/.ssh/known_hosts
      mv /tmp/release-source.tar.gz "$1"
      scp -o StrictHostKeyChecking=yes "$1" "root@$2:$1"
      REMOTE_SETUP
    - ssh "$remote" "sudo -n ssh -o StrictHostKeyChecking=yes root@$OBSERVABILITY_SSH_HOST 'sh -s -- \"$archive\" \"$VERSION\"'" < scripts/deploy/apply-observability-release.sh

windows-production-package:
  extends: .node-windows-package
  stage: package
  timeout: 25m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - verify-tag
    - deploy-observability-runtime
  variables:
    VITE_PUBLIC_API_BASE_URL: '$PRODUCTION_API_BASE_URL'
    HAWK_DESKTOP_MAIN_ENABLED: 'true'
    HAWK_DESKTOP_RENDERER_ENABLED: 'true'
    HAWK_DESKTOP_MAIN_TOKEN: '$HAWK_DESKTOP_MAIN_TOKEN'
    HAWK_DESKTOP_RENDERER_TOKEN: '$HAWK_DESKTOP_RENDERER_TOKEN'
    VITE_HAWK_DESKTOP_RENDERER_ENABLED: 'true'
    VITE_HAWK_DESKTOP_RENDERER_TOKEN: '$HAWK_DESKTOP_RENDERER_TOKEN'
    HAWK_DESKTOP_RELEASE: '$CI_COMMIT_TAG'
    VITE_HAWK_DESKTOP_RELEASE: '$CI_COMMIT_TAG'
    RELEASE_BRANCH: '$PRODUCTION_BRANCH'
    CSC_LINK: '$WINDOWS_CSC_LINK'
    CSC_KEY_PASSWORD: '$WINDOWS_CSC_KEY_PASSWORD'
    CSC_IDENTITY_AUTO_DISCOVERY: '$WINDOWS_CSC_ENABLED'
  script:
    - |
      if ([string]::IsNullOrWhiteSpace($env:HAWK_DESKTOP_MAIN_TOKEN)) {
        Write-Error 'HAWK_DESKTOP_MAIN_TOKEN must be configured as a protected CI/CD variable.'
        exit 1
      }
      if ([string]::IsNullOrWhiteSpace($env:HAWK_DESKTOP_RENDERER_TOKEN)) {
        Write-Error 'HAWK_DESKTOP_RENDERER_TOKEN must be configured as a protected CI/CD variable.'
        exit 1
      }
    - npm run release:validate
    - npm run package:win
    - |
      Get-ChildItem apps/desktop/release/* -File | Get-FileHash -Algorithm SHA256 |
        ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
        Set-Content apps/desktop/release/SHA256SUMS.txt
      $metadata = [ordered]@{
        version = $env:VERSION
        commitSha = $env:CI_COMMIT_SHA
        tag = $env:CI_COMMIT_TAG
        channel = 'stable'
        builtAt = (Get-Date).ToUniversalTime().ToString('o')
        pipelineId = $env:CI_PIPELINE_ID
      }
      $metadata | ConvertTo-Json | Set-Content apps/desktop/release/release-metadata.json
  artifacts:
    expire_in: 90 days
    name: 'vatrushka-production-$VERSION'
    paths: [apps/desktop/release/]

publish-production:
  image: registry.gitlab.com/gitlab-org/cli:v1.108.0
  tags: [vatrushka-linux]
  stage: publish
  timeout: 15m
  interruptible: false
  resource_group: 'production-$CI_COMMIT_TAG'
  environment:
    name: production
    url: https://api.myvatrushka.ru
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
    - job: deploy-production-runtime
    - job: deploy-observability-runtime
    - job: windows-production-package
      artifacts: true
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: 'true'
  before_script:
    - apk add --no-cache openssh-client
  script:
    - |
      for name in PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_HOST_KEY PRODUCTION_SSH_HOST PRODUCTION_SSH_USER PRODUCTION_UPDATE_PATH; do
        test -n "$(eval "printf '%s' \"\$$name\"")" || { echo "Required production setting is missing: $name" >&2; exit 1; }
      done
      echo "$PRODUCTION_UPDATE_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$' || { echo 'PRODUCTION_UPDATE_PATH has unsafe characters.' >&2; exit 1; }
    - |
      install -d -m 700 ~/.ssh
      install -m 600 "$PRODUCTION_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
      install -m 600 "$PRODUCTION_SSH_HOST_KEY" ~/.ssh/known_hosts
      setup=$(find apps/desktop/release -maxdepth 1 -name 'Vatrushka-Setup-*-x64.exe' -print -quit)
      blockmap=$(find apps/desktop/release -maxdepth 1 -name 'Vatrushka-Setup-*-x64.exe.blockmap' -print -quit)
      test -f "$setup" && test -f "$blockmap" && test -f apps/desktop/release/latest.yml || { echo 'Stable feed artifacts are incomplete.' >&2; exit 1; }
      remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
      scp "$setup" "$blockmap" apps/desktop/release/SHA256SUMS.txt apps/desktop/release/release-metadata.json "$remote:$PRODUCTION_UPDATE_PATH/"
      scp apps/desktop/release/latest.yml "$remote:$PRODUCTION_UPDATE_PATH/latest.yml.next"
      ssh "$remote" "mv -- '$PRODUCTION_UPDATE_PATH/latest.yml.next' '$PRODUCTION_UPDATE_PATH/latest.yml'"
    - |
      find apps/desktop/release -maxdepth 1 -type f -print -quit | grep -q . || { echo 'Release artifact contains no publishable files.' >&2; exit 1; }
      if ! glab release view "$CI_COMMIT_TAG" >/dev/null 2>&1; then
        glab release create "$CI_COMMIT_TAG" --name "Vatrushka $VERSION" --notes "Production release $CI_COMMIT_TAG"
      fi
      find apps/desktop/release -maxdepth 1 -type f \
        -exec glab release upload "$CI_COMMIT_TAG" --use-package-registry --package-name "vatrushka-$VERSION" {} +
