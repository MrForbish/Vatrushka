workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - policy
  - quality
  - candidate
  - release
  - package
  - deploy
  - publish

variables:
  GIT_DEPTH: "0"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  PRODUCTION_BRANCH: "main"
  PRODUCTION_API_BASE_URL: "https://api.myvatrushka.ru"
  PRODUCTION_UPDATE_FEED: "https://api.myvatrushka.ru/updates"
  OBSERVABILITY_SSH_HOST: "201.51.4.24"
  WINDOWS_TOOLCHAIN_MIRROR: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/windows-toolchain/43.1.1"
  WINDOWS_CSC_ENABLED: "false"

.node-linux:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:24-bookworm
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  cache:
    key:
      files: [package-lock.json]
      prefix: linux-npm
    paths: [.npm/]
    policy: pull-push
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  interruptible: true

.node-windows:
  tags: [vatrushka-windows]
  variables:
    PLAYWRIGHT_BROWSERS_PATH: '$CI_PROJECT_DIR/.cache/ms-playwright'
    ELECTRON_BUILDER_CACHE: '$CI_PROJECT_DIR/.cache/electron-builder'
  cache:
    key:
      files: [package-lock.json]
      prefix: windows-node-playwright
    paths:
      - .npm/
      - .cache/ms-playwright/
    policy: pull-push
  before_script:
    - $env:Path = "$env:NODE_HOME;$env:Path"
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  interruptible: true

.node-windows-package:
  extends: .node-windows
  cache:
    - key:
        files: [package-lock.json]
        prefix: windows-node-playwright
      paths:
        - .npm/
      policy: pull-push
    - key: windows-toolchain-43-1-1
      paths:
        - .cache/electron-builder/
        - .cache/electron-dist/
      policy: pull-push

.observability-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [infra/observability/**/*, scripts/observability/**/*]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

.develop-candidate-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'

.immutable-image-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+\.\d+$/'
    # A hotfix is promoted from main through an immutable tag. Build its
    # production candidate before merge so the tag pipeline can promote the
    # exact reviewed parent commit rather than rebuilding it after approval.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^hotfix\/\d+\.\d+\.\d+-.+$/'

.release-candidate-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+\.\d+$/'
    # Hotfixes have the same stable-candidate contract as release branches.
    # The tag pipeline verifies the merge parent and resolves these immutable
    # artifacts by its SHA; it must never rebuild a reviewed hotfix.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^hotfix\/\d+\.\d+\.\d+-.+$/'

.staging-candidate-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'

.staging-ssh:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.22
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  before_script:
    - apk add --no-cache jq openssh-client
    - test -n "${STAGING_SSH_PRIVATE_KEY_B64:-}" || { echo 'STAGING_SSH_PRIVATE_KEY_B64 is required.' >&2; exit 1; }
    - test -n "${STAGING_SSH_HOST_KEY:-}" || { echo 'STAGING_SSH_HOST_KEY is required.' >&2; exit 1; }
    - test -n "${STAGING_SSH_HOST:-}" || { echo 'STAGING_SSH_HOST is required.' >&2; exit 1; }
    - test -n "${STAGING_SSH_USER:-}" || { echo 'STAGING_SSH_USER is required.' >&2; exit 1; }
    - test -f "$STAGING_SSH_HOST_KEY" || { echo 'STAGING_SSH_HOST_KEY must be a file variable.' >&2; exit 1; }
    - echo "$STAGING_SSH_HOST" | grep -Eq '^[A-Za-z0-9.-]+$' || { echo 'STAGING_SSH_HOST has unsafe characters.' >&2; exit 1; }
    - echo "$STAGING_SSH_USER" | grep -Eq '^[a-z_][a-z0-9_-]*$' || { echo 'STAGING_SSH_USER has unsafe characters.' >&2; exit 1; }
    - install -d -m 700 ~/.ssh
    # Keep the private key as a one-line protected variable. This avoids text
    # encoding changes to multiline file variables created from Windows.
    - printf '%s' "$STAGING_SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -lf ~/.ssh/id_ed25519 >/dev/null
    - install -m 600 "$STAGING_SSH_HOST_KEY" ~/.ssh/known_hosts

build-api-immutable-image:
  extends: .immutable-image-rules
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28-cli
    pull_policy: if-not-present
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28-dind
      alias: docker
      pull_policy: if-not-present
  tags: [vatrushka-linux]
  stage: candidate
  timeout: 15m
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: $DOCKER_TLS_CERTDIR/client
  before_script:
    - apk add --no-cache jq
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker context create vatrushka-dind --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --name vatrushka-candidate --driver docker-container --use vatrushka-dind
  script:
    - export IMAGE_REF="$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - docker buildx build --pull --push --metadata-file image-metadata.json --tag "$IMAGE_REF" --build-arg "BUILD_COMMIT=$CI_COMMIT_SHA" -f infra/docker/Dockerfile.api .
    - export API_IMAGE_DIGEST="$(jq -er '."containerimage.digest"' image-metadata.json)"
    - echo "$API_IMAGE_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
    - printf 'API_IMAGE_REF=%s@%s\nAPI_IMAGE_DIGEST=%s\n' "$CI_REGISTRY_IMAGE/api" "$API_IMAGE_DIGEST" "$API_IMAGE_DIGEST" > candidate-image.env
  artifacts:
    expire_in: 30 days
    reports:
      dotenv: candidate-image.env
    paths: [image-metadata.json, candidate-image.env]

create-staging-candidate-manifest:
  extends:
    - .node-linux
    - .develop-candidate-rules
  stage: candidate
  timeout: 4m
  needs:
    - job: build-api-immutable-image
      artifacts: true
  script:
    - mkdir -p candidate
    - git archive --format=tar "$CI_COMMIT_SHA" | gzip -n > candidate-source.tar.gz
    - test -s candidate-source.tar.gz
    - export SOURCE_ARCHIVE_SHA256="$(sha256sum candidate-source.tar.gz | awk '{print $1}')"
    - echo "$SOURCE_ARCHIVE_SHA256" | grep -Eq '^[a-f0-9]{64}$'
    - mv candidate-source.tar.gz "candidate/$SOURCE_ARCHIVE_SHA256.tar.gz"
    - |
      migration_required=false
      migration_compatibility=none
      if [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && \
         git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" -- apps/api/drizzle | grep -q .; then
        migration_required=true
        migration_compatibility=manual-review
      fi
      node scripts/delivery/create-candidate-manifest.mjs \
        --version "$(node -p "require('./package.json').version")" \
        --commit-sha "$CI_COMMIT_SHA" \
        --source-archive "candidate/$SOURCE_ARCHIVE_SHA256.tar.gz" \
        --dependency-lock package-lock.json \
        --channel beta \
        --api-environment staging \
        --image "api=$API_IMAGE_DIGEST" \
        --migration-required "$migration_required" \
        --migration-compatibility "$migration_compatibility" \
        --output candidate/candidate.json
    - sha256sum candidate/candidate.json "candidate/$SOURCE_ARCHIVE_SHA256.tar.gz" package-lock.json > candidate/SHA256SUMS
  artifacts:
    expire_in: 30 days
    paths: [candidate/]

create-release-candidate-manifest:
  extends:
    - .node-linux
    - .release-candidate-rules
  stage: candidate
  timeout: 5m
  interruptible: false
  needs:
    - job: build-api-immutable-image
      artifacts: true
  script:
    - mkdir -p release-candidate
    - git archive --format=tar "$CI_COMMIT_SHA" | gzip -n > release-source.tar.gz
    - test -s release-source.tar.gz
    - export SOURCE_ARCHIVE_SHA256="$(sha256sum release-source.tar.gz | awk '{print $1}')"
    - echo "$SOURCE_ARCHIVE_SHA256" | grep -Eq '^[a-f0-9]{64}$'
    - mv release-source.tar.gz "release-candidate/$SOURCE_ARCHIVE_SHA256.tar.gz"
    - |
      previous_tag="$(git tag --merged "$CI_COMMIT_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)"
      migration_required=false
      migration_compatibility=none
      if [ -n "$previous_tag" ] && git diff --name-only "$previous_tag" "$CI_COMMIT_SHA" -- apps/api/drizzle | grep -q .; then
        migration_required=true
        migration_compatibility=manual-review
      fi
      node scripts/delivery/create-candidate-manifest.mjs \
        --version "$(node -p "require('./package.json').version")" \
        --commit-sha "$CI_COMMIT_SHA" \
        --source-archive "release-candidate/$SOURCE_ARCHIVE_SHA256.tar.gz" \
        --dependency-lock package-lock.json \
        --channel stable \
        --api-environment production \
        --image "api=$API_IMAGE_DIGEST" \
        --migration-required "$migration_required" \
        --migration-compatibility "$migration_compatibility" \
        --output release-candidate/candidate.json
    - cp package-lock.json release-candidate/package-lock.json
    - (cd release-candidate && sha256sum candidate.json "$SOURCE_ARCHIVE_SHA256.tar.gz" package-lock.json > SHA256SUMS)
    - |
      package_base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/vatrushka-release-candidate/$CI_COMMIT_SHA"
      for file in candidate.json "$SOURCE_ARCHIVE_SHA256.tar.gz" package-lock.json SHA256SUMS; do
        status="$(curl --silent --output /dev/null --write-out '%{http_code}' --header "JOB-TOKEN: $CI_JOB_TOKEN" "$package_base/$file")"
        test "$status" = 404 || { echo "Immutable release candidate asset already exists or cannot be checked: $file (HTTP $status)" >&2; exit 1; }
        curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "release-candidate/$file" "$package_base/$file"
      done
  artifacts:
    expire_in: 90 days
    paths: [release-candidate/]

resolve-production-api-image:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.22
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  stage: candidate
  timeout: 5m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      test -n "${RELEASE_CANDIDATE_SHA:-}" || { echo 'Release candidate SHA is missing.' >&2; exit 1; }
      package_base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/vatrushka-release-candidate/$RELEASE_CANDIDATE_SHA"
      curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" -o release-candidate.json "$package_base/candidate.json"
      jq -e --arg version "$VERSION" --arg sha "$RELEASE_CANDIDATE_SHA" '.version == $version and .commitSha == $sha and .channel == "stable" and .apiEnvironment == "production"' release-candidate.json >/dev/null
      export API_IMAGE_DIGEST="$(jq -er '.images.api' release-candidate.json)"
      echo "$API_IMAGE_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
      printf 'API_IMAGE_DIGEST=%s\nRELEASE_CANDIDATE_SHA=%s\n' "$API_IMAGE_DIGEST" "$RELEASE_CANDIDATE_SHA" > production-image.env
  artifacts:
    expire_in: 30 days
    reports:
      dotenv: production-image.env
    paths: [production-image.env]

create-production-candidate-manifest:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.22
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  stage: candidate
  timeout: 5m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
    - job: resolve-production-api-image
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      test -n "${RELEASE_CANDIDATE_SHA:-}" || { echo 'Release candidate SHA is missing.' >&2; exit 1; }
      package_base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/vatrushka-release-candidate/$RELEASE_CANDIDATE_SHA"
      mkdir -p production-candidate
      curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" -o production-candidate/candidate.json "$package_base/candidate.json"
      source_archive_sha="$(jq -er '.sourceArchiveSha256' production-candidate/candidate.json)"
      echo "$source_archive_sha" | grep -Eq '^[a-f0-9]{64}$'
      curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "production-candidate/$source_archive_sha.tar.gz" "$package_base/$source_archive_sha.tar.gz"
      curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" -o production-candidate/package-lock.json "$package_base/package-lock.json"
      curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" -o production-candidate/SHA256SUMS "$package_base/SHA256SUMS"
      (cd production-candidate && sha256sum -c SHA256SUMS)
      jq -e --arg version "$VERSION" --arg sha "$RELEASE_CANDIDATE_SHA" --arg digest "$API_IMAGE_DIGEST" '.version == $version and .commitSha == $sha and .images.api == $digest and .channel == "stable" and .apiEnvironment == "production"' production-candidate/candidate.json >/dev/null
  artifacts:
    expire_in: 90 days
    paths: [production-candidate/]

deploy-staging-candidate:
  extends:
    - .staging-ssh
    - .staging-candidate-rules
  stage: candidate
  timeout: 8m
  interruptible: false
  resource_group: staging-candidate
  environment:
    name: staging
  needs:
    - job: create-staging-candidate-manifest
      artifacts: true
  script:
    - source_archive_sha="$(jq -er '.sourceArchiveSha256' candidate/candidate.json)"
    - echo "$source_archive_sha" | grep -Eq '^[a-f0-9]{64}$'
    - source_archive="candidate/$source_archive_sha.tar.gz"
    - test -f "$source_archive" || { echo 'Candidate source archive is missing.' >&2; exit 1; }
    - remote="$STAGING_SSH_USER@$STAGING_SSH_HOST"
    - scp candidate/candidate.json "$source_archive" "$remote:/var/lib/vatrushka/inbox/"
    - manifest="$(ssh "$remote" 'sudo -n /usr/local/lib/vatrushka/vatrushka-preflight /var/lib/vatrushka/inbox/candidate.json')"
    - echo "$manifest" | grep -Eq '^/var/lib/vatrushka/manifests/candidate-[a-f0-9]{64}\.json$' || { echo 'Preflight returned an invalid manifest path.' >&2; exit 1; }
    - ssh "$remote" "sudo -n /usr/local/lib/vatrushka/vatrushka-deploy '$manifest'"
    - ssh "$remote" 'sudo -n /usr/local/lib/vatrushka/vatrushka-runtime-status'
    - ssh "$remote" "sudo -n /usr/local/lib/vatrushka/vatrushka-observability-deploy '$manifest'"

merge-request-policy:
  extends: .node-linux
  stage: policy
  timeout: 2m
  before_script: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - node scripts/policy/merge-request-policy.mjs
    - |
      if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" = "$PRODUCTION_BRANCH" ] && [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = "develop" ]; then
        latest_tag=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
        test -n "$latest_tag" || { echo 'Sync MR does not contain a production SemVer tag.' >&2; exit 1; }
        echo "Sync contains production tag $latest_tag"
      fi

verify-tag:
  extends: .node-linux
  stage: policy
  timeout: 2m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_TAG'
      when: never
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      git fetch origin "$PRODUCTION_BRANCH"
      git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$PRODUCTION_BRANCH" || { echo 'Tagged commit is not in the production branch.' >&2; exit 1; }
      set -- $(git show -s --format=%P "$CI_COMMIT_SHA")
      test "$#" = 2 || { echo 'Stable tag must point to a reviewed release or hotfix merge commit.' >&2; exit 1; }
      release_candidate_sha="$2"
      echo "$release_candidate_sha" | grep -Eq '^[a-f0-9]{40}$' || { echo 'Release candidate parent is invalid.' >&2; exit 1; }
      test "$(node -p "require('./package.json').version")" = "$version" || { echo 'Tag and package version differ.' >&2; exit 1; }
      printf 'VERSION=%s\nRELEASE_CANDIDATE_SHA=%s\n' "$version" "$release_candidate_sha" > release.env
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 30 days

verify:
  extends:
    - .node-linux
  stage: quality
  # The complete quality bundle includes lint, typecheck, unit tests and builds.
  # Self-hosted runners may be temporarily CPU-constrained; eight minutes causes
  # a false timeout while lint is still making progress.
  timeout: 20m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [apps/**/*, packages/**/*, scripts/**/*, infra/docker/**/*, package.json, package-lock.json, tsconfig.base.json, eslint.config.*]
  script:
    - npm run repo-policy:test
    - npm run version:check
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run db:check
    - npm run build
    - npm run perf:check

integration:
  extends:
    - .node-linux
  stage: quality
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [apps/api/**/*, packages/**/*, scripts/**/*, infra/docker/**/*, package.json, package-lock.json]
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:17-alpine
      alias: postgres
      pull_policy: if-not-present
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/redis:8-alpine
      alias: redis
      pull_policy: if-not-present
  variables:
    POSTGRES_DB: vatrushka_test
    POSTGRES_USER: vatrushka
    POSTGRES_PASSWORD: integration-test-password
    INTEGRATION_DATABASE_URL: postgresql://vatrushka:integration-test-password@postgres:5432/vatrushka_test
    INTEGRATION_REDIS_URL: redis://redis:6379/15
  script:
    - npm run build -w @vatrushka/shared
    - npm run test:integration

observability-compose:
  extends: .observability-rules
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28-cli
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  script:
    - cp infra/observability/platform/.env.observability.example infra/observability/platform/.env.observability
    - cp infra/observability/platform/secrets/grafana_admin_password.example infra/observability/platform/secrets/grafana_admin_password
    - cp infra/observability/platform/secrets/alertmanager_webhook_url.example infra/observability/platform/secrets/alertmanager_webhook_url
    - cp infra/observability/platform/secrets/loki_aws_credentials.example infra/observability/platform/secrets/loki_aws_credentials
    - docker compose --env-file infra/observability/platform/.env.observability -f infra/observability/platform/docker-compose.yml config -q
    - POSTGRES_PASSWORD=validation REDIS_PASSWORD=validation docker compose --env-file infra/observability/agents/.env.agent.example -f infra/observability/agents/docker-compose.yml --profile product --profile docker config -q

observability-prometheus:
  extends: .observability-rules
  image:
    name: quay.io/prometheus/prometheus:v3.12.0
    entrypoint: [""]
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  script:
    - promtool check config infra/observability/platform/prometheus/prometheus.yml
    - promtool check rules infra/observability/platform/prometheus/rules/*.yml

observability-alertmanager:
  extends: .observability-rules
  image:
    name: quay.io/prometheus/alertmanager:v0.28.1
    entrypoint: [""]
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  script:
    - amtool check-config infra/observability/platform/alertmanager/alertmanager.yml

observability-loki:
  extends: .observability-rules
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/grafana/loki:3.5.5
    entrypoint: [""]
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  variables:
    AWS_ACCESS_KEY_ID: validation
    AWS_SECRET_ACCESS_KEY: validation
    LOKI_S3_ENDPOINT: https://s3.example.invalid
    LOKI_S3_REGION: ru-1
    LOKI_S3_BUCKET: validation
  script:
    - /usr/bin/loki -verify-config=true -config.expand-env=true -config.file=infra/observability/platform/loki/loki.yml

observability-alloy:
  extends: .observability-rules
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/grafana/alloy:v1.10.2
    entrypoint: [""]
  tags: [vatrushka-linux]
  stage: quality
  timeout: 3m
  before_script: []
  variables:
    OBSERVABILITY_HOST: validation
    OBSERVABILITY_ROLE: product
    OBSERVABILITY_ENVIRONMENT: production
    OBSERVABILITY_REGION: ru
    PROMETHEUS_REMOTE_WRITE_URL: http://127.0.0.1:9090/api/v1/write
    LOKI_WRITE_URL: http://127.0.0.1:3100/loki/api/v1/push
  script:
    - alloy validate infra/observability/platform/alloy/platform.alloy
    - alloy validate infra/observability/agents/alloy/product.alloy
    - alloy validate infra/observability/agents/alloy/runner.alloy

observability-caddy:
  extends: .observability-rules
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/caddy:2.10-alpine
    entrypoint: [""]
  tags: [vatrushka-linux]
