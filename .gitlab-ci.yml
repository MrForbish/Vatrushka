desktop-behavior:
  extends:
    - .node-windows
  stage: quality
  timeout: 12m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [apps/desktop/**/*, packages/shared/**/*, packages/config/**/*, package.json, package-lock.json]
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/prepare-windows-browser-tests.ps1
    - npx playwright install chromium
    - npm run build -w @vatrushka/shared
    - node scripts/ci/run-with-budget.mjs --name "Storybook interaction" --budget-seconds 180 -- npm run test:storybook
    - node scripts/ci/run-with-budget.mjs --name "Electron E2E" --budget-seconds 90 -- npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths:
      - apps/desktop/test-results/
      - apps/desktop/playwright-report/

visual-regression:
  extends:
    - .node-windows
  stage: quality
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [apps/desktop/**/*, packages/shared/**/*, packages/config/**/*, package.json, package-lock.json]
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/prepare-windows-browser-tests.ps1
    - npx playwright install chromium
    - npm run build -w @vatrushka/shared
    - node scripts/ci/run-with-budget.mjs --name "Static Storybook visual" --budget-seconds 180 -- npm run test:visual
  after_script:
    - |
      $storybookListeners = @(Get-NetTCPConnection -LocalPort 6006 -State Listen -ErrorAction SilentlyContinue)
      $storybookListeners |
        Select-Object -ExpandProperty OwningProcess -Unique |
        ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
      Write-Output "Storybook port cleanup complete."
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths:
      - apps/desktop/test-results/
      - apps/desktop/playwright-report/

release-validate:
  extends:
    - .node-linux
  stage: release
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  variables:
    RELEASE_BRANCH: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
  script:
    - |
      if [ -z "$RELEASE_BRANCH" ]; then export RELEASE_BRANCH="$CI_COMMIT_BRANCH"; fi
      npm run release:validate
    - npm run db:check
    - |
      mkdir -p release-metadata
      {
        echo "commit=$CI_COMMIT_SHA"
        echo "migration_count=$(find apps/api/drizzle -maxdepth 1 -name '*.sql' | wc -l)"
        echo "last_migration=$(find apps/api/drizzle -maxdepth 1 -name '*.sql' -printf '%f\n' | sort | tail -1)"
      } > release-metadata/migrations.txt
  artifacts:
    expire_in: 30 days
    paths: [release-metadata/migrations.txt]

database-upgrade:
  extends:
    - .node-linux
  stage: release
  timeout: 8m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:17-alpine
      alias: postgres
      pull_policy: if-not-present
  variables:
    POSTGRES_DB: vatrushka_upgrade
    POSTGRES_USER: vatrushka
    POSTGRES_PASSWORD: upgrade-test-password
    DATABASE_URL: postgresql://vatrushka:upgrade-test-password@postgres:5432/vatrushka_upgrade
  script:
    - |
      PREVIOUS_WORKTREE="../previous-production-$CI_JOB_ID"
      cleanup_previous_worktree() {
        git worktree remove --force "$PREVIOUS_WORKTREE" >/dev/null 2>&1 || true
        git worktree prune
      }
      trap cleanup_previous_worktree EXIT
      git fetch origin "$PRODUCTION_BRANCH"
      git worktree add "$PREVIOUS_WORKTREE" "origin/$PRODUCTION_BRANCH"
      npm --prefix "$PREVIOUS_WORKTREE" ci --prefer-offline --no-audit --no-fund
      npm --prefix "$PREVIOUS_WORKTREE" run build -w @vatrushka/shared
      npm --prefix "$PREVIOUS_WORKTREE" run db:migrate -w @vatrushka/api
    - npm run build -w @vatrushka/shared
    - npm run db:migrate -w @vatrushka/api
    - npm run db:check
    - mkdir -p release-metadata
    - printf 'previous_ref=%s\ncandidate_sha=%s\nresult=passed\n' "origin/$PRODUCTION_BRANCH" "$CI_COMMIT_SHA" > release-metadata/database-upgrade.txt
  artifacts:
    expire_in: 30 days
    paths: [release-metadata/database-upgrade.txt]

release-evidence:
  extends: .node-linux
  stage: release
  timeout: 4m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  variables:
    RELEASE_BRANCH: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
  script:
    - npm run release:validate
    - |
      if grep -RInE 'localhost:|127\.0\.0\.1:|VITE_.*DEBUG=true' apps/desktop/.env.production.example apps/desktop/package.json; then
        echo 'Production desktop configuration contains a development URL or debug flag.' >&2
        exit 1
      fi
    - printf '%s' "$CI_MERGE_REQUEST_DESCRIPTION" | grep -qi 'rollback' || { echo 'MR description must contain a rollback plan.' >&2; exit 1; }
    - printf '%s' "$CI_MERGE_REQUEST_DESCRIPTION" | grep -Eqi 'release (notes|evidence)|release notes|release evidence' || { echo 'MR description must reference release notes/evidence.' >&2; exit 1; }

release-auth-smoke:
  image: registry.gitlab.com/gitlab-org/cli:v1.108.0
  tags: [vatrushka-linux]
  stage: release
  timeout: 2m
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: 'true'
  script:
    - glab release view v0.6.6 >/dev/null

.production-ssh:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.22
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  environment:
    name: production
    url: https://api.myvatrushka.ru
  interruptible: false
  before_script:
    - apk add --no-cache jq openssh-client
    - |
      for name in PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_HOST_KEY PRODUCTION_SSH_HOST PRODUCTION_SSH_USER; do
        test -n "$(eval "printf '%s' \"\$$name\"")" || { echo "Required production setting is missing: $name" >&2; exit 1; }
      done
      test -f "$PRODUCTION_SSH_PRIVATE_KEY" || { echo 'PRODUCTION_SSH_PRIVATE_KEY must be a file variable.' >&2; exit 1; }
      test -f "$PRODUCTION_SSH_HOST_KEY" || { echo 'PRODUCTION_SSH_HOST_KEY must be a file variable.' >&2; exit 1; }
      echo "$PRODUCTION_SSH_HOST" | grep -Eq '^[A-Za-z0-9.-]+$' || { echo 'PRODUCTION_SSH_HOST has unsafe characters.' >&2; exit 1; }
      echo "$PRODUCTION_SSH_USER" | grep -Eq '^[a-z_][a-z0-9_-]*$' || { echo 'PRODUCTION_SSH_USER has unsafe characters.' >&2; exit 1; }
      install -d -m 700 ~/.ssh
      tr -d '\r' < "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keygen -lf ~/.ssh/id_ed25519 >/dev/null
      tr -d '\r' < "$PRODUCTION_SSH_HOST_KEY" > ~/.ssh/known_hosts
      chmod 600 ~/.ssh/known_hosts
      ssh-keygen -F "$PRODUCTION_SSH_HOST" -f ~/.ssh/known_hosts >/dev/null || { echo 'PRODUCTION_SSH_HOST_KEY does not contain the configured host.' >&2; exit 1; }

.observer-ssh:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.22
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  environment:
    name: production
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client
    - |
      for name in OBSERVER_SSH_PRIVATE_KEY OBSERVER_SSH_HOST_KEY OBSERVER_SSH_HOST OBSERVER_SSH_USER; do
        test -n "$(eval "printf '%s' \"\$$name\"")" || { echo "Required observer setting is missing: $name" >&2; exit 1; }
      done
      test -f "$OBSERVER_SSH_PRIVATE_KEY" || { echo 'OBSERVER_SSH_PRIVATE_KEY must be a file variable.' >&2; exit 1; }
      test -f "$OBSERVER_SSH_HOST_KEY" || { echo 'OBSERVER_SSH_HOST_KEY must be a file variable.' >&2; exit 1; }
      echo "$OBSERVER_SSH_HOST" | grep -Eq '^[A-Za-z0-9.-]+$' || { echo 'OBSERVER_SSH_HOST has unsafe characters.' >&2; exit 1; }
      echo "$OBSERVER_SSH_USER" | grep -Eq '^[a-z_][a-z0-9_-]*$' || { echo 'OBSERVER_SSH_USER has unsafe characters.' >&2; exit 1; }
      install -d -m 700 ~/.ssh
      tr -d '\r' < "$OBSERVER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keygen -lf ~/.ssh/id_ed25519 >/dev/null
      tr -d '\r' < "$OBSERVER_SSH_HOST_KEY" > ~/.ssh/known_hosts
      chmod 600 ~/.ssh/known_hosts
      ssh-keygen -F "$OBSERVER_SSH_HOST" -f ~/.ssh/known_hosts >/dev/null || { echo 'OBSERVER_SSH_HOST_KEY does not contain the configured host.' >&2; exit 1; }

deploy-production-runtime:
  extends: .production-ssh
  stage: deploy
  timeout: 20m
  resource_group: production-runtime
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: false
  needs:
    - job: verify-tag
      artifacts: true
    - job: preflight-production-runtime
    - job: backup-production-postgresql
    - job: create-production-candidate-manifest
      artifacts: true
    - job: resolve-production-desktop-package
      artifacts: true
  script:
    - source_archive_sha="$(jq -er '.sourceArchiveSha256' production-candidate/candidate.json)"
    - echo "$source_archive_sha" | grep -Eq '^[a-f0-9]{64}$'
    - source_archive="production-candidate/$source_archive_sha.tar.gz"
    - test -f "$source_archive" || { echo 'Production candidate source archive is missing.' >&2; exit 1; }
    - remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
    - scp production-candidate/candidate.json "$source_archive" "$remote:/var/lib/vatrushka/inbox/"
    - manifest="$(ssh "$remote" 'sudo -n /usr/local/lib/vatrushka/vatrushka-preflight /var/lib/vatrushka/inbox/candidate.json')"
    - echo "$manifest" | grep -Eq '^/var/lib/vatrushka/manifests/candidate-[a-f0-9]{64}\.json$' || { echo 'Preflight returned an invalid manifest path.' >&2; exit 1; }
    - ssh "$remote" "sudo -n /usr/local/lib/vatrushka/vatrushka-deploy '$manifest'"
    - ssh "$remote" 'sudo -n /usr/local/lib/vatrushka/vatrushka-runtime-status'

backup-production-postgresql:
  extends: .production-ssh
  stage: deploy
  timeout: 20m
  resource_group: production-runtime
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
    - job: preflight-production-runtime
  script:
    - remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
    - ssh "$remote" 'sudo -n /usr/local/lib/vatrushka/vatrushka-postgresql-backup'

preflight-production-runtime:
  extends: .production-ssh
  stage: deploy
  timeout: 5m
  resource_group: production-runtime
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
  script:
    - remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
    - ssh "$remote" 'sudo -n /usr/local/lib/vatrushka/vatrushka-production-readiness'

deploy-production-observability-agent:
  extends: .production-ssh
  stage: deploy
  timeout: 10m
  resource_group: production-observability-agent
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: deploy-production-runtime
    - job: create-production-candidate-manifest
      artifacts: true
  script:
    - manifest_checksum="$(sha256sum production-candidate/candidate.json | awk '{print $1}')"
    - echo "$manifest_checksum" | grep -Eq '^[a-f0-9]{64}$'
    - remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
    - manifest="/var/lib/vatrushka/manifests/candidate-$manifest_checksum.json"
    - ssh "$remote" "sudo -n /usr/local/lib/vatrushka/vatrushka-observability-deploy '$manifest'"

verify-production-observability:
  extends: .observer-ssh
  stage: deploy
  timeout: 5m
  resource_group: production-observability-verification
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: deploy-production-observability-agent
  script:
    - observer="$OBSERVER_SSH_USER@$OBSERVER_SSH_HOST"
    - ssh "$observer" 'sudo -n /usr/local/lib/vatrushka/vatrushka-observability-verify production'

rollback-production-runtime:
  extends: .production-ssh
  stage: publish
  timeout: 20m
  resource_group: production-runtime
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: true
  needs:
    - job: deploy-production-runtime
    - job: create-production-candidate-manifest
      artifacts: true
  script:
    - manifest_checksum="$(sha256sum production-candidate/candidate.json | awk '{print $1}')"
    - echo "$manifest_checksum" | grep -Eq '^[a-f0-9]{64}$'
    - remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
    - rollback_manifest="/var/lib/vatrushka/manifests/rollback-$manifest_checksum.json"
    - ssh "$remote" "sudo -n /usr/local/lib/vatrushka/vatrushka-rollback '$rollback_manifest'"
    - ssh "$remote" 'sudo -n /usr/local/lib/vatrushka/vatrushka-runtime-status'

windows-production-package:
  stage: package
  timeout: 25m
  interruptible: false
  extends:
    - .node-windows-package
    - .release-candidate-rules
  variables:
    VITE_PUBLIC_API_BASE_URL: '$PRODUCTION_API_BASE_URL'
    RELEASE_BRANCH: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'
    CSC_LINK: '$WINDOWS_CSC_LINK'
    CSC_KEY_PASSWORD: '$WINDOWS_CSC_KEY_PASSWORD'
    CSC_IDENTITY_AUTO_DISCOVERY: '$WINDOWS_CSC_ENABLED'
  script:
    - |
      # Merge-request pipelines have no CI_COMMIT_BRANCH. Release branch
      # pipelines have no CI_MERGE_REQUEST_SOURCE_BRANCH_NAME. Normalize the
      # validated branch before release:validate so both reviewed paths use the
      # same package contract.
      if ([string]::IsNullOrWhiteSpace($env:RELEASE_BRANCH)) {
        $env:RELEASE_BRANCH = $env:CI_COMMIT_BRANCH
      }
      if ([string]::IsNullOrWhiteSpace($env:RELEASE_BRANCH)) {
        Write-Error 'RELEASE_BRANCH could not be resolved for production package validation.'
        exit 1
      }

      function Test-HawkIntegrationToken([string] $value) {
        try {
          $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value)) | ConvertFrom-Json
          return -not [string]::IsNullOrWhiteSpace([string] $decoded.integrationId) -and
            -not [string]::IsNullOrWhiteSpace([string] $decoded.secret)
        } catch {
          return $false
        }
      }

      if ([string]::IsNullOrWhiteSpace($env:HAWK_DESKTOP_MAIN_TOKEN)) {
        Write-Error 'HAWK_DESKTOP_MAIN_TOKEN must be configured as a protected CI/CD variable.'
        exit 1
      }
      if ([string]::IsNullOrWhiteSpace($env:HAWK_DESKTOP_RENDERER_TOKEN)) {
        Write-Error 'HAWK_DESKTOP_RENDERER_TOKEN must be configured as a protected CI/CD variable.'
        exit 1
      }
      if (-not (Test-HawkIntegrationToken $env:HAWK_DESKTOP_MAIN_TOKEN)) {
        Write-Error 'HAWK_DESKTOP_MAIN_TOKEN must be a valid Hawk integration token.'
        exit 1
      }
      if (-not (Test-HawkIntegrationToken $env:HAWK_DESKTOP_RENDERER_TOKEN)) {
        Write-Error 'HAWK_DESKTOP_RENDERER_TOKEN must be a valid Hawk integration token.'
        exit 1
      }

      # Do not define a CI variable in terms of itself in YAML: GitLab leaves it as
      # a literal string and the packager then receives an invalid Hawk token.
      # The protected variables stay inherited; only distinct build-time aliases are
      # exported here for the Electron main and renderer bundles.
      $env:VERSION = node -p "require('./package.json').version"
      $release = if ([string]::IsNullOrWhiteSpace($env:CI_COMMIT_TAG)) { "main-$env:CI_COMMIT_SHORT_SHA" } else { $env:CI_COMMIT_TAG }
      $env:HAWK_DESKTOP_MAIN_ENABLED = 'true'
      $env:HAWK_DESKTOP_RENDERER_ENABLED = 'true'
      $env:VITE_HAWK_DESKTOP_RENDERER_ENABLED = 'true'
      $env:VITE_HAWK_DESKTOP_RENDERER_TOKEN = $env:HAWK_DESKTOP_RENDERER_TOKEN
      $env:HAWK_DESKTOP_RELEASE = $release
      $env:VITE_HAWK_DESKTOP_RELEASE = $release
    - npm run release:validate
    - npm run package:win
    - |
      Get-ChildItem apps/desktop/release/* -File | Get-FileHash -Algorithm SHA256 |
        ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
        Set-Content apps/desktop/release/SHA256SUMS.txt
      $metadata = [ordered]@{
        version = $env:VERSION
        commitSha = $env:CI_COMMIT_SHA
        tag = $env:CI_COMMIT_TAG
        channel = 'stable'
        builtAt = (Get-Date).ToUniversalTime().ToString('o')
        pipelineId = $env:CI_PIPELINE_ID
      }
      $metadata | ConvertTo-Json | Set-Content apps/desktop/release/release-metadata.json
      $archive = "production-desktop-$env:CI_COMMIT_SHA.tar.gz"
      tar.exe -czf $archive -C apps/desktop/release .
      $archiveHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
      "$archiveHash  $archive" | Set-Content "$archive.sha256"
      $packageBase = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/vatrushka-production-desktop/$env:CI_COMMIT_SHA"
      $archiveUrl = "$packageBase/$archive"
      $existing = & curl.exe --silent --output NUL --write-out '%{http_code}' --header "JOB-TOKEN: $env:CI_JOB_TOKEN" $archiveUrl
      if ($existing -eq '200') {
        Write-Error 'Immutable production desktop package already exists for this commit.'
        exit 1
      }
      if ($existing -ne '404') {
        Write-Error "Cannot verify immutable package availability (HTTP $existing)."
        exit 1
      }
      & curl.exe --fail --show-error --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file $archive $archiveUrl
      & curl.exe --fail --show-error --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file "$archive.sha256" "$packageBase/$archive.sha256"
  artifacts:
    expire_in: 90 days
    name: 'vatrushka-production-$VERSION'
    paths: [apps/desktop/release/, production-desktop-*.tar.gz, production-desktop-*.tar.gz.sha256]

resolve-production-desktop-package:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.22
    pull_policy: if-not-present
  tags: [vatrushka-linux]
  stage: candidate
  timeout: 5m
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
  before_script:
    - apk add --no-cache curl jq tar
  script:
    - |
      test -n "${RELEASE_CANDIDATE_SHA:-}" || { echo 'Release candidate SHA is missing.' >&2; exit 1; }
      archive="production-desktop-$RELEASE_CANDIDATE_SHA.tar.gz"
      package_base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/vatrushka-production-desktop/$RELEASE_CANDIDATE_SHA"
      mkdir -p production-desktop/release
      curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "production-desktop/$archive" "$package_base/$archive"
      curl --fail --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "production-desktop/$archive.sha256" "$package_base/$archive.sha256"
      # The producer is the Windows runner, whose checksum sidecar can use CRLF.
      # Normalize it before verification so the filename cannot contain a trailing CR.
      (cd production-desktop && tr -d '\r' < "$archive.sha256" | sha256sum -c -)
      tar -xzf "production-desktop/$archive" -C production-desktop/release
      test -f production-desktop/release/latest.yml
      test -f production-desktop/release/SHA256SUMS.txt
      test -f production-desktop/release/release-metadata.json
      find production-desktop/release -maxdepth 1 -name 'Vatrushka-Setup-*-x64.exe' -print -quit | grep -q .
      metadata_sha="$(jq -er '.commitSha' production-desktop/release/release-metadata.json)"
      test "$metadata_sha" = "$RELEASE_CANDIDATE_SHA" || { echo 'Desktop package does not match the approved release candidate.' >&2; exit 1; }
  artifacts:
    expire_in: 90 days
    paths: [production-desktop/release/]

publish-production:
  extends: .production-ssh
  image: registry.gitlab.com/gitlab-org/cli:v1.108.0
  tags: [vatrushka-linux]
  stage: publish
  timeout: 15m
  interruptible: false
  resource_group: 'production-$CI_COMMIT_TAG'
  environment:
    name: production
    url: https://api.myvatrushka.ru
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  needs:
    - job: verify-tag
      artifacts: true
    - job: deploy-production-runtime
    - job: verify-production-observability
    - job: resolve-production-desktop-package
      artifacts: true
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: 'true'
  before_script:
    - apk add --no-cache jq openssh-client
  script:
    - |
      for name in PRODUCTION_SSH_PRIVATE_KEY PRODUCTION_SSH_HOST_KEY PRODUCTION_SSH_HOST PRODUCTION_SSH_USER; do
        test -n "$(eval "printf '%s' \"\$$name\"")" || { echo "Required production setting is missing: $name" >&2; exit 1; }
      done
    - |
      install -d -m 700 ~/.ssh
      tr -d '\r' < "$PRODUCTION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keygen -lf ~/.ssh/id_ed25519 >/dev/null
      tr -d '\r' < "$PRODUCTION_SSH_HOST_KEY" > ~/.ssh/known_hosts
      chmod 600 ~/.ssh/known_hosts
      ssh-keygen -F "$PRODUCTION_SSH_HOST" -f ~/.ssh/known_hosts >/dev/null || { echo 'PRODUCTION_SSH_HOST_KEY does not contain the configured host.' >&2; exit 1; }
      setup=$(find production-desktop/release -maxdepth 1 -name 'Vatrushka-Setup-*-x64.exe' -print -quit)
      blockmap=$(find production-desktop/release -maxdepth 1 -name 'Vatrushka-Setup-*-x64.exe.blockmap' -print -quit)
      latest=production-desktop/release/latest.yml
      checksums=production-desktop/release/SHA256SUMS.txt
      metadata=production-desktop/release/release-metadata.json
      test -f "$setup" && test -f "$blockmap" && test -f "$latest" && test -f "$checksums" && test -f "$metadata" || { echo 'Stable feed artifacts are incomplete.' >&2; exit 1; }
      setup_name=$(basename "$setup")
      blockmap_name=$(basename "$blockmap")
      jq -n \
        --arg version "$VERSION" \
        --arg setup_name "$setup_name" --arg setup_sha "$(sha256sum "$setup" | awk '{print $1}')" \
        --arg blockmap_name "$blockmap_name" --arg blockmap_sha "$(sha256sum "$blockmap" | awk '{print $1}')" \
        --arg latest_sha "$(sha256sum "$latest" | awk '{print $1}')" \
        --arg checksums_sha "$(sha256sum "$checksums" | awk '{print $1}')" \
        --arg metadata_sha "$(sha256sum "$metadata" | awk '{print $1}')" \
        '{version: $version, files: {setup: {name: $setup_name, sha256: $setup_sha}, blockmap: {name: $blockmap_name, sha256: $blockmap_sha}, latest: {name: "latest.yml", sha256: $latest_sha}, checksums: {name: "SHA256SUMS.txt", sha256: $checksums_sha}, metadata: {name: "release-metadata.json", sha256: $metadata_sha}}}' \
        > "production-desktop/release/updater-$CI_COMMIT_TAG.json"
      # The receiving wrapper rejects group/other writable inputs. Artifacts can
      # retain executable modes from the Windows packaging archive, so normalize
      # every file that crosses the unprivileged SSH boundary before scp.
      chmod 0644 "$setup" "$blockmap" "$latest" "$checksums" "$metadata" "production-desktop/release/updater-$CI_COMMIT_TAG.json"
      remote="$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST"
      scp "$setup" "$blockmap" "$latest" "$checksums" "$metadata" "production-desktop/release/updater-$CI_COMMIT_TAG.json" "$remote:/var/lib/vatrushka/inbox/"
      ssh "$remote" "sudo -n /usr/local/lib/vatrushka/vatrushka-publish-updater '/var/lib/vatrushka/inbox/updater-$CI_COMMIT_TAG.json'"
    - |
      find production-desktop/release -maxdepth 1 -type f -print -quit | grep -q . || { echo 'Release artifact contains no publishable files.' >&2; exit 1; }
      if ! glab release view "$CI_COMMIT_TAG" >/dev/null 2>&1; then
        glab release create "$CI_COMMIT_TAG" --name "Vatrushka $VERSION" --notes "Production release $CI_COMMIT_TAG"
      fi
      find production-desktop/release -maxdepth 1 -type f \
        -exec glab release upload "$CI_COMMIT_TAG" --use-package-registry --package-name "vatrushka-$VERSION" {} +
